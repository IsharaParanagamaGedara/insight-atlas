<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />

    <meta
      name="description"
      content="Insight Atlas is an interactive platform for exploring global data stories."
    />

    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="/favicon-32x32.png"
    />

    <link
      rel="icon"
      type="image/png"
      sizes="16x16"
      href="/favicon-16x16.png"
    />

    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="/apple-touch-icon.png"
    />

    <!--
      Critical startup styles.
      These prevent the project icon and page background
      from briefly appearing unstyled before Vite loads SCSS.
    -->
    <style>
      html,
      body {
        margin: 0;
        background-color: #07111f;
      }

      .brand__mark {
        width: 46px;
        height: 46px;
        overflow: hidden;
        flex: 0 0 46px;
      }

      .brand__mark img {
        display: block;
        width: 46px;
        height: 46px;
        object-fit: cover;
      }

      @media (max-width: 600px) {
        .brand__mark {
          width: 42px;
          height: 42px;
          flex-basis: 42px;
        }

        .brand__mark img {
          width: 42px;
          height: 42px;
        }
      }
    </style>

    <title>Insight Atlas</title>
  </head>

  <body>
    <div class="app">
      <header class="site-header">
        <a
          class="brand"
          href="/"
          aria-label="Insight Atlas home"
        >
          <span
            class="brand__mark"
            aria-hidden="true"
          >
            <img
              src="/insight-atlas-icon.png"
              alt=""
              width="46"
              height="46"
            />
          </span>

          <span class="brand__text">
            <strong class="brand__name">
              Insight Atlas
            </strong>

            <span class="brand__tagline">
              Stories in data
            </span>
          </span>
        </a>

        <nav
          class="site-nav"
          aria-label="Primary navigation"
        >
          <a
            class="site-nav__link site-nav__link--active"
            href="#stories"
          >
            Stories
          </a>

          <a
            class="site-nav__link"
            href="#about"
          >
            About
          </a>

          <a
            class="site-nav__link"
            href="#sources"
          >
            Sources
          </a>

          <button
            class="header-action"
            type="button"
            aria-label="Search data stories"
          >
            <svg
              aria-hidden="true"
              viewBox="0 0 24 24"
              fill="none"
              xmlns="http://www.w3.org/2000/svg"
            >
              <path
                d="M11 19a8 8 0 1 0 0-16 8 8 0 0 0 0 16Z"
                stroke="currentColor"
                stroke-width="1.8"
              />

              <path
                d="m21 21-4.35-4.35"
                stroke="currentColor"
                stroke-width="1.8"
                stroke-linecap="round"
              />
            </svg>
          </button>
        </nav>
      </header>

      <main>
        <section
          class="hero"
          id="stories"
          aria-labelledby="hero-title"
        >
          <div
            class="hero__background"
            aria-hidden="true"
          >
            <div class="hero__image"></div>
            <div class="hero__overlay"></div>
            <div class="hero__grid"></div>
          </div>

          <div
            class="story-transition"
            aria-hidden="true"
          ></div>

          <div class="hero__content">
            <div class="hero__meta">
              <span class="hero__category"></span>

              <span
                class="hero__separator"
                aria-hidden="true"
              ></span>

              <span class="hero__number"></span>
            </div>

            <p class="hero__eyebrow"></p>

            <h1
              class="hero__title"
              id="hero-title"
            >
              <span class="hero__title-line"></span>
              <span class="hero__title-accent"></span>
            </h1>

            <p class="hero__description"></p>

            <div class="hero__statistic">
              <strong
                class="hero__statistic-value"
              ></strong>

              <span
                class="hero__statistic-description"
              ></span>
            </div>

            <div class="hero__actions">
              <button
                class="button button--primary"
                type="button"
              >
                Explore the Story

                <span aria-hidden="true">
                  →
                </span>
              </button>

              <button
                class="button button--secondary"
                type="button"
              >
                View Sources
              </button>
            </div>
          </div>

          <aside
            class="story-queue"
            aria-label="Upcoming data stories"
          >
            <div class="story-queue__header">
              <span>Up Next</span>

              <span
                class="story-queue__count"
                aria-label="Current story position"
              ></span>
            </div>

            <div class="story-queue__list"></div>
          </aside>

          <div
            class="story-controls"
            aria-label="Story navigation"
          >
            <button
              class="story-control story-control--previous"
              type="button"
              aria-label="Show previous story"
            >
              <svg
                aria-hidden="true"
                viewBox="0 0 24 24"
                fill="none"
                xmlns="http://www.w3.org/2000/svg"
              >
                <path
                  d="M15 18 9 12l6-6"
                  stroke="currentColor"
                  stroke-width="1.8"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                />
              </svg>
            </button>

            <div class="story-progress">
              <div class="story-progress__information">
                <span class="story-progress__title">
                  Current Story
                </span>

                <span class="story-progress__fraction">
                  01 / 06
                </span>
              </div>

              <div
                class="story-progress__track"
                role="progressbar"
                aria-label="Story progress"
                aria-valuemin="1"
                aria-valuemax="6"
                aria-valuenow="1"
              >
                <div class="story-progress__bar"></div>
              </div>
            </div>

            <button
              class="story-control story-control--next"
              type="button"
              aria-label="Show next story"
            >
              <svg
                aria-hidden="true"
                viewBox="0 0 24 24"
                fill="none"
                xmlns="http://www.w3.org/2000/svg"
              >
                <path
                  d="m9 18 6-6-6-6"
                  stroke="currentColor"
                  stroke-width="1.8"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                />
              </svg>
            </button>

            <button
              class="story-control story-control--autoplay"
              type="button"
              aria-label="Pause automatic story playback"
              aria-pressed="true"
            >
              <svg
                class="autoplay-icon autoplay-icon--pause"
                aria-hidden="true"
                viewBox="0 0 24 24"
                fill="none"
                xmlns="http://www.w3.org/2000/svg"
              >
                <path
                  d="M8 5v14M16 5v14"
                  stroke="currentColor"
                  stroke-width="2"
                  stroke-linecap="round"
                />
              </svg>

              <svg
                class="autoplay-icon autoplay-icon--play"
                aria-hidden="true"
                viewBox="0 0 24 24"
                fill="none"
                xmlns="http://www.w3.org/2000/svg"
              >
                <path
                  d="m8 5 11 7-11 7V5Z"
                  stroke="currentColor"
                  stroke-width="1.8"
                  stroke-linejoin="round"
                />
              </svg>
            </button>
          </div>

          <div
            class="hero__side-label"
            aria-hidden="true"
          >
            <span>Global Data Stories</span>
          </div>

          <div
            class="hero__scroll-hint"
            aria-hidden="true"
          >
            <span class="hero__scroll-line"></span>
            <span>Explore</span>
          </div>
        </section>

        <section
          class="placeholder-section"
          id="about"
          aria-labelledby="about-title"
        >
          <h2 id="about-title">
            About Insight Atlas
          </h2>
        </section>

        <section
          class="placeholder-section"
          id="sources"
          aria-labelledby="sources-title"
        >
          <h2 id="sources-title">
            Data Sources
          </h2>
        </section>
      </main>
    </div>

    <script
      type="module"
      src="/src/main.js"
    ></script>
  </body>
</html>
